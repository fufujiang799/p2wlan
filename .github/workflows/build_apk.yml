name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        working-directory: apps/flutter_client
        run: flutter pub get

      - name: Configure Flutter-pinned Android NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          ndk_version="$(grep -RhoE 'ndkVersion[[:space:]]*=[[:space:]]*"[0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle" | head -n 1 | sed -E 's/.*"([0-9.]+)"/\1/')"
          test -n "$ndk_version" || { echo "unable to resolve Flutter-pinned Android NDK version" >&2; exit 1; }
          ndk_root="$sdk_root/ndk/$ndk_version"
          if [[ ! -d "$ndk_root" ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
            if [[ -z "$sdkmanager_bin" ]]; then
              sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1)"
            fi
            test -n "$sdkmanager_bin" || { echo "sdkmanager is unavailable while installing Flutter-pinned Android NDK $ndk_version" >&2; exit 1; }
            yes 2>/dev/null | "$sdkmanager_bin" --sdk_root="$sdk_root" "ndk;$ndk_version"
          fi
          test -d "$ndk_root" || { echo "Android NDK unavailable after installation: $ndk_root" >&2; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
          echo "Using Android NDK $ndk_version"

      - name: Build Release APK
        working-directory: apps/flutter_client
        env:
          P2WLAN_ANDROID_ABIS: arm64-v8a
        run: |
          cd ../../
          bash scripts/release/build_flutter_client.sh apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOOMli-chat-release-apk
          path: apps/flutter_client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
